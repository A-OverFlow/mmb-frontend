# Nginx 메인 프로세스 수 (일반적으로 1개면 충분)
worker_processes 1;

events {
  # 동시에 처리할 수 있는 최대 연결 수
  worker_connections 1024;
}

http {
  # 파일 타입 설정
  include       mime.types;
  default_type  application/octet-stream;

  # 파일 전송 최적화 옵션
  sendfile        on;
  keepalive_timeout 65;

  # Gzip 압축 설정 (전송 최적화)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # =====================================================
  # 1. HTTP (포트 80) 요청 처리: HTTPS로 리다이렉트
  # =====================================================
  server {
    listen 80;
    server_name mumulbo.com *.mumulbo.com;

    # 모든 요청을 HTTPS로 리다이렉트 (301 Permanent Redirect)
    return 301 https://$host$request_uri;
  }

  # =====================================================
  # 2. HTTPS (포트 443) 요청 처리
  # =====================================================
  server {
    listen 443 ssl;
    server_name mumulbo.com *.mumulbo.com;

    # SSL 인증서 파일 경로
    ssl_certificate /etc/letsencrypt/live/dev.mumulbo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mumulbo.com/privkey.pem;

    # SSL 프로토콜 및 암호화 설정 (TLS 1.2 / 1.3만 허용)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # 정적 파일 루트 디렉토리 설정
    root /usr/share/nginx/html;
    index index.html;

    # ===========================================
    # React SPA 라우팅 지원 (index.html fallback)
    # ===========================================
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ===========================================
    # API 요청 프록시 설정 (/api → API Gateway)
    # ===========================================
    location /api/ {
      proxy_pass http://${API_GATEWAY_HOST}/api/;
      proxy_http_version 1.1;

      # 요청 헤더 설정 (원본 요청 정보를 API Gateway에 전달)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      proxy_cache_bypass $http_upgrade;
    }
  }
}
