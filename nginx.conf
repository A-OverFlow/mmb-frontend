worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # 1. HTTP → HTTPS 리다이렉트
  server {
    listen 80;
    server_name mumulbo.com *.mumulbo.com;
    return 301 https://$host$request_uri;
  }

  # 2. HTTPS 서버 블록
  server {
    listen 443 ssl;
    server_name mumulbo.com *.mumulbo.com;

    ssl_certificate     /etc/letsencrypt/live/dev.mumulbo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mumulbo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    root /usr/share/nginx/html;
    index index.html;

    # React SPA
    location / {
      try_files $uri $uri/ /index.html;
    }

    # /images 요청은 MinIO로 프록시
    location /images/ {
      proxy_pass        http://${MINIO_HOST};
      proxy_http_version 1.1;
      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # API Gateway 프록시
    location /api/ {
      proxy_pass        http://${API_GATEWAY_HOST}/api/;
      proxy_http_version 1.1;
      proxy_set_header  Host              $host;
      proxy_set_header  X-Real-IP         $remote_addr;
      proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header  Upgrade           $http_upgrade;
      proxy_set_header  Connection        'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
  }
}
